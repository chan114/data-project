<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 태그</title>
</head>
<body>
    <h3>순서가 있는 목록 ol </h3>
     <ol type="I">
        <li>사과</li>
        <li>오렌지</li>
        <li>바나나</li>
     </ol>
     <h3>순서가 없는 목록 ol </h3>
     <ul>
        <li>사과</li>
        <li>오렌지</li>
        <li>바나나</li>
     </ul>   
</body>
</html>
